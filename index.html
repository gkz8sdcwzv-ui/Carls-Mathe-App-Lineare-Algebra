<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineare Algebra – Lernapp (Wirtschaftsmathematik Hohenheim)</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1c2330;--mut:#667085;--pri:#1f5fbf;--prifg:#fff;--ok:#1a7f37;--bad:#c62828;--bd:#d6dbe3;--okbg:#e6f4ea;--badbg:#fdecea}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e8ebf0;--mut:#9aa4b2;--pri:#6ea8ff;--prifg:#0b1220;--ok:#4cc26a;--bad:#ff7b7b;--bd:#343c4a;--okbg:#17321f;--badbg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header .in{max-width:900px;margin:0 auto;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center}
header h1{font-size:1.05rem;margin:0;flex:1 1 auto}
nav{display:flex;flex-wrap:wrap;gap:.3rem}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:.45rem .8rem;cursor:pointer}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--prifg);border-color:var(--pri);font-weight:600}
nav button.on{background:var(--pri);color:var(--prifg);border-color:var(--pri)}
main{max-width:900px;margin:0 auto;padding:1rem}
.card,.task{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1rem 1.2rem;margin:0 0 1rem}
.card h2,.task h3{margin:.1rem 0 .6rem}
.task h3{font-size:1rem;border-bottom:1px solid var(--bd);padding-bottom:.4rem}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem;margin-bottom:1rem}
.tile{display:flex;flex-direction:column;gap:.2rem;text-align:left;padding:.8rem 1rem;border-radius:12px}
.tile small{color:var(--pri);font-weight:600;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em}
.bar{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-bottom:.8rem}
select{font:inherit;padding:.35rem .5rem;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.prompt{margin:.5rem 0 .8rem}
.part{margin:.9rem 0;padding-top:.2rem}
.plabel{margin-bottom:.35rem;font-weight:500}
input.in{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:.35rem .5rem}
input.num{width:11rem}
.mgrid{border-collapse:collapse}
.mgrid td{padding:2px}
input.cell{width:5.2rem;text-align:center}
input.okin{border-color:var(--ok);background:var(--okbg)}
input.badin{border-color:var(--bad);background:var(--badbg)}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem .6rem;border:1px solid var(--bd);border-radius:8px;margin:.3rem 0;cursor:pointer}
.opt input{margin-top:.3rem}
.opt.optok{border-color:var(--ok);background:var(--okbg)}
.opt.optbad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:.3rem;font-size:.95rem}
.fb.ok{color:var(--ok);font-weight:600}
.fb.bad{color:var(--bad)}
.sol{margin-top:.9rem;padding:.7rem .9rem;border-left:4px solid var(--pri);background:var(--bg);border-radius:6px;font-size:.95rem;overflow-x:auto}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.2rem}
.mx{display:inline-table;vertical-align:middle;margin:.15rem .3rem;border-left:2px solid var(--fg);border-right:2px solid var(--fg);border-radius:9px;border-collapse:separate;border-spacing:0;padding:0 .15rem}
.mx td{padding:.05rem .45rem;text-align:center;white-space:nowrap}
.timer{position:sticky;top:3.2rem;z-index:4;display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;background:var(--card);border:1px solid var(--pri);border-radius:12px;padding:.6rem 1rem;margin-bottom:1rem}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem;margin-left:auto}
#clock.warn{color:var(--bad)}
.big{font-size:2rem;font-weight:700}
table.info{border-collapse:collapse}
table.info td,table.info th{border:1px solid var(--bd);padding:.3rem .6rem;text-align:left}
.eq{margin:.2rem 0 .2rem 1rem}
ul{padding-left:1.2rem;margin:.4rem 0}
.fs h3{margin:1rem 0 .3rem;color:var(--pri)}
</style>
</head>
<body>
<header><div class="in">
<h1>Lineare Algebra · Lernapp</h1>
<nav>
<button data-v="home">Start</button>
<button data-v="mc">Multiple Choice</button>
<button data-v="calc">Rechenaufgaben</button>
<button data-v="tests">Probetests</button>
<button data-v="formeln">Formeln</button>
</nav>
</div></header>
<main id="view"></main>
<script>
'use strict';
/* ===== Bruchrechnung und Matrizen ===== */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
function fr(n,d){d=d||1;if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
function toF(x){if(typeof x==='object')return x;if(Number.isInteger(x))return fr(x,1);return fr(Math.round(x*1000),1000)}
const fadd=(a,b)=>fr(a.n*b.d+b.n*a.d,a.d*b.d),fsub=(a,b)=>fr(a.n*b.d-b.n*a.d,a.d*b.d),fmul=(a,b)=>fr(a.n*b.n,a.d*b.d),fdiv=(a,b)=>fr(a.n*b.d,a.d*b.n);
const fneg=a=>fr(-a.n,a.d),fz=a=>a.n===0,fval=a=>typeof a==='number'?a:a.n/a.d;
function nstr(x){return(Number.isInteger(x)?String(x):String(Math.round(x*10000)/10000).replace('.',',')).replace('-','−')}
function fstr(a){if(typeof a==='string')return a;if(typeof a==='number')return nstr(a);return(a.n<0?'−':'')+Math.abs(a.n)+(a.d!==1?'/'+a.d:'')}
const Fm=A=>A.map(r=>r.map(toF));
const mT=A=>A[0].map((_,j)=>A.map(r=>r[j]));
const mmul=(A,B)=>A.map(r=>B[0].map((_,j)=>r.reduce((s,a,k)=>fadd(s,fmul(a,B[k][j])),fr(0))));
const madd=(A,B)=>A.map((r,i)=>r.map((a,j)=>fadd(a,B[i][j])));
const msub=(A,B)=>A.map((r,i)=>r.map((a,j)=>fsub(a,B[i][j])));
const mscal=(k,A)=>A.map(r=>r.map(a=>fmul(toF(k),a)));
const meq=(A,B)=>A.every((r,i)=>r.every((a,j)=>a.n===B[i][j].n&&a.d===B[i][j].d));
const minor=(A,i,j)=>A.filter((_,r)=>r!==i).map(r=>r.filter((_,c)=>c!==j));
function mdet(A){const n=A.length;if(n===1)return A[0][0];if(n===2)return fsub(fmul(A[0][0],A[1][1]),fmul(A[0][1],A[1][0]));
 let s=fr(0);for(let j=0;j<n;j++){if(fz(A[0][j]))continue;const c=fmul(A[0][j],mdet(minor(A,0,j)));s=j%2?fsub(s,c):fadd(s,c)}return s}
function minv(A){const n=A.length,d=mdet(A);if(fz(d))throw new Error('Matrix singulär');
 return A.map((_,i)=>A.map((_,j)=>{const c=mdet(minor(A,j,i));return fdiv((i+j)%2?fneg(c):c,d)}))}
function gauss(A){const G=A.map(r=>r.slice()),m=G.length,n=G[0].length;let r=0;
 for(let c=0;c<n&&r<m;c++){let p=-1;for(let i=r;i<m;i++)if(!fz(G[i][c])){p=i;break}if(p<0)continue;
  const t=G[p];G[p]=G[r];G[r]=t;
  for(let i=r+1;i<m;i++){if(fz(G[i][c]))continue;const f=fdiv(G[i][c],G[r][c]);G[i]=G[i].map((a,k)=>fsub(a,fmul(f,G[r][k])))}
  r++}
 return{E:G,rank:r}}
/* ===== Darstellung ===== */
function M(A){return'<table class="mx">'+A.map(r=>'<tr>'+r.map(a=>'<td>'+fstr(a)+'</td>').join('')+'</tr>').join('')+'</table>'}
const col=v=>v.map(a=>[a]);
const dim=A=>A.length+'×'+A[0].length;
const par=s=>s[0]==='−'?'('+s+')':s;
const pn=a=>par(fstr(toF(a)));
function poly(ts){let s='';ts.forEach(([c,v])=>{c=toF(c);if(fz(c))return;const neg=c.n<0,a=fstr(fr(Math.abs(c.n),c.d));
 const body=(a==='1'&&v?'':a+(v&&c.d!==1?'·':''))+v;s+=s?(neg?' − ':' + ')+body:(neg?'−':'')+body});return s||'0'}
const VARS=['x₁','x₂','x₃','x₄'];
/* ===== Aufgaben-Bausteine ===== */
const TOP={vek:'Vektoren',mat:'Matrizenrechnung',bes:'Besondere Matrizen',det:'Determinante',inv:'Inverse',rang:'Rang',lgs:'LGS & Gauß',qf:'Quadratische Formen'};
const T=(topic,title,prompt,parts,sol)=>({topic,title,prompt,parts,sol});
const num=(label,ans,o)=>Object.assign({t:'num',label,ans},o||{});
const mat=(label,ans)=>({t:'mat',label,ans});
const sc=(label,opts,ans,fix)=>({t:'sc',label,opts,ans,fix:!!fix});
const mc=(label,opts,ans)=>({t:'mc',label,opts,ans});
const REG=['regulär (nicht singulär)','singulär'];
const DEF=['positiv definit','positiv semidefinit','indefinit','negativ semidefinit','negativ definit'];
const need=(c,m)=>{if(!c)throw new Error('Aufgabe fehlerhaft: '+m)};
/* --- Vektoren --- */
const dot=(v,w)=>v.reduce((s,a,i)=>s+a*w[i],0);
function tLin(v,w,a,b){const r=v.map((x,i)=>[fr(a*x+b*w[i])]);
 return T('vek','Linearkombination',`Gegeben sind v = ${M(col(v))} und w = ${M(col(w))}. Berechnen Sie ${a}v ${b<0?'−':'+'} ${Math.abs(b)}w.`,
 [mat('Ergebnis =',r)],`Skalarmultiplikation und Addition erfolgen elementweise, z. B. 1. Element: ${a}·${pn(v[0])} ${b<0?'−':'+'} ${Math.abs(b)}·${pn(w[0])} = ${fstr(r[0][0])}.`)}
function tVec(v,w){const d=dot(v,w),l=Math.sqrt(dot(v,v)),O=mmul(Fm(col(v)),Fm([w]));
 return T('vek','Vektorprodukte und Länge',`Gegeben sind v = ${M(col(v))} und w = ${M(col(w))}.`,
 [num('Inneres Produkt v′w =',fr(d)),num('Länge ‖v‖ = (auf 2 Dezimalstellen)',l),mat('Äußeres Produkt vw′ =',O)],
 `v′w = ${v.map((a,i)=>pn(a)+'·'+pn(w[i])).join(' + ')} = ${nstr(d)} (ein Skalar). ‖v‖ = √(v′v) = √${dot(v,v)} ≈ ${nstr(Math.round(l*100)/100)}. Das äußere Produkt vw′ ist eine ${v.length}×${w.length}-Matrix mit den Elementen vᵢ·wⱼ.`)}
function tAngle(v,w){const d=dot(v,w),lv=Math.sqrt(dot(v,v)),lw=Math.sqrt(dot(w,w)),c=d/(lv*lw),g=Math.acos(Math.max(-1,Math.min(1,c)))*180/Math.PI;
 need(Math.abs(g-Math.floor(g)-0.5)>0.03,'Winkel zu nah an ,5');
 return T('vek','Winkel zwischen zwei Vektoren',`Bestimmen Sie den Winkel γ zwischen v = ${M(col(v))} und w = ${M(col(w))}.`,
 [num('v′w =',fr(d)),num('γ in Grad (auf ganze Grad gerundet) =',Math.round(g),{tol:0.51})],
 `cos γ = v′w / (‖v‖·‖w‖) = ${nstr(d)} / (√${dot(v,v)}·√${dot(w,w)}) ≈ ${nstr(c)}. Also γ = arccos(${nstr(c)}) ≈ ${nstr(Math.round(g*100)/100)}° ≈ ${Math.round(g)}°. Taschenrechner auf Grad (DEG) stellen!`)}
function tOrth(a,b,c3){const x=fdiv(fr(-(a[0]*b[0]+a[1]*b[1])),fr(a[2]));
 const A=[[fr(a[0]),fr(a[1])],[fr(b[0]),fr(b[1])]],r=[[fr(-a[2]*c3)],[fmul(fr(-c3),x)]];need(!fz(mdet(A)),'tOrth');
 const s=mmul(minv(A),r),y=s[0][0],z=s[1][0];
 return T('vek','Orthogonalität',`Bestimmen Sie x, y und z so, dass die Vektoren ${M(col(a))}, ${M([[b[0]],[b[1]],['x']])} und ${M([['y'],['z'],[c3]])} paarweise orthogonal sind.`,
 [num('x =',x),num('y =',y),num('z =',z)],
 `Orthogonal heißt: inneres Produkt = 0. Aus Vektor 1 · Vektor 2 = 0: ${poly([[a[0]*b[0]+a[1]*b[1],''],[a[2],'x']])} = 0 → x = ${fstr(x)}. Dann liefern Vektor 1 · Vektor 3 = 0 und Vektor 2 · Vektor 3 = 0 das LGS ${poly([[a[0],'y'],[a[1],'z']])} = ${fstr(r[0][0])} und ${poly([[b[0],'y'],[b[1],'z']])} = ${fstr(r[1][0])} mit der Lösung y = ${fstr(y)}, z = ${fstr(z)}.`)}
function tIndep(vs){const A=mT(Fm(vs)),d=mdet(A);
 return T('vek','Lineare Unabhängigkeit',`Sind die Vektoren ${vs.map(v=>M(col(v))).join(', ')} linear unabhängig? Schreiben Sie die Vektoren als Spalten in eine Matrix A.`,
 [num('det(A) =',d),sc('Die Vektoren sind …',['linear unabhängig','linear abhängig'],fz(d)?1:0,true)],
 `A = ${M(A)}, det(A) = ${fstr(d)}. `+(fz(d)?'det(A) = 0 → die Spalten sind linear abhängig (ein Vektor lässt sich als Linearkombination der anderen darstellen).':'det(A) ≠ 0 → die Spalten sind linear unabhängig und bilden eine Basis.'))}
/* --- Matrizenrechnung --- */
function tMul(A,B,title){const P=mmul(Fm(A),Fm(B));
 return T('mat',title||'Matrixmultiplikation',`Gegeben sind A = ${M(A)} und B = ${M(B)}. Berechnen Sie AB.`,[mat('AB =',P)],
 `A ist ${dim(A)}, B ist ${dim(B)} → konform, AB ist ${A.length}×${B[0].length}. Element (i, j) = i-te Zeile von A mal j-te Spalte von B (Falk-Schema). Z. B. Element (1, 1): ${A[0].map((a,k)=>pn(a)+'·'+pn(B[k][0])).join(' + ')} = ${fstr(P[0][0])}.`)}
function tComm(A,B){const AB=mmul(Fm(A),Fm(B)),BA=mmul(Fm(B),Fm(A));
 return T('mat','AB und BA',`Gegeben sind A = ${M(A)} und B = ${M(B)}.`,[mat('AB =',AB),mat('BA =',BA),sc('Gilt hier AB = BA?',['ja','nein'],meq(AB,BA)?0:1,true)],
 `Die Matrixmultiplikation ist im Allgemeinen nicht kommutativ: AB ≠ BA. Deshalb unterscheidet man Prä- und Postmultiplikation.`)}
function tExpand(A,B){const a=Fm(A),b=Fm(B),S=madd(a,b),D=msub(a,b),AA=mmul(a,a),BB=mmul(b,b),AB=mmul(a,b),BA=mmul(b,a);
 return T('mat','Binomische Formeln bei Matrizen',`Gegeben sind A = ${M(A)} und B = ${M(B)}. Berechnen Sie:`,
 [mat('(A + B)² =',mmul(S,S)),mat('A² + 2AB + B² =',madd(madd(AA,mscal(2,AB)),BB)),mat('(A − B)² =',mmul(D,D)),mat('A² − 2AB + B² =',madd(msub(AA,mscal(2,AB)),BB))],
 `Richtig ausmultipliziert gilt (A + B)² = A² + AB + BA + B² und (A − B)² = A² − AB − BA + B². Weil hier AB = ${M(AB)} ≠ BA = ${M(BA)}, gelten die binomischen Formeln nicht.`)}
function tPow(A){const a=Fm(A),a2=mmul(a,a);
 return T('mat','Potenz einer Matrix',`Gegeben ist A = ${M(A)}. Berechnen Sie A² und A³.`,[mat('A² =',a2),mat('A³ =',mmul(a2,a))],`A² = A·A, A³ = A²·A. (Außerdem: A⁰ = I.)`)}
function tAtA(A){const a=Fm(A),t=mT(a);
 return T('bes','A′A und AA′',`Gegeben ist A = ${M(A)}. Berechnen Sie A′A und AA′.`,[mat('A′A =',mmul(t,a)),mat('AA′ =',mmul(a,t))],
 `A′ = ${M(t)}. A′A ist ${A[0].length}×${A[0].length}, AA′ ist ${A.length}×${A.length}. Beide Produkte sind immer symmetrisch.`)}
function tSolveX(A,B,left){const a=Fm(A),b=Fm(B),I=minv(a),X=left?mmul(I,b):mmul(b,I);
 return T('inv','Matrixgleichung nach X auflösen',`Gegeben sind A = ${M(A)} und B = ${M(B)}. Lösen Sie die Gleichung ${left?'AX = B':'XA = B'} nach X auf.`,
 [mat('A⁻¹ =',I),mat('X =',X)],
 left?`Von links mit A⁻¹ multiplizieren: A⁻¹AX = A⁻¹B → X = A⁻¹B. (Nicht BA⁻¹ – die Reihenfolge zählt!)`:`Von rechts mit A⁻¹ multiplizieren: XAA⁻¹ = BA⁻¹ → X = BA⁻¹. (Nicht A⁻¹B – die Reihenfolge zählt!)`)}
/* --- Idempotenz --- */
const isIdem=A=>meq(mmul(A,A),A);
function tIdemSC(mats,ans){const F=mats.map(Fm);need(F.filter(isIdem).length===1&&isIdem(F[ans]),'tIdemSC');
 return T('bes','Idempotenz (Single Choice)','Welche der folgenden Matrizen ist idempotent?',[sc('',F.map(M),ans)],
 `Idempotent heißt AA = A. Nur für ${M(F[ans])} ergibt das Produkt mit sich selbst wieder die Matrix. Jede Matrix kurz quadrieren und vergleichen.`)}
function tIdemX(a,c){const x=fdiv(fr(a-a*a),fr(c)),A=[[fr(a),x],[fr(c),fr(1-a)]];need(isIdem(A),'tIdemX');
 return T('bes','Idempotenz – Parameter bestimmen',`Für welchen Wert von x ist A = ${M([[a,'x'],[c,1-a]])} idempotent?`,[num('x =',x)],
 `AA = A verlangt für Element (1, 1): ${pn(a)}·${pn(a)} + x·${pn(c)} = ${a} → x = ${fstr(x)}. Probe: ${M(A)}·${M(A)} = ${M(mmul(A,A))}.`)}
function tIdemChk(A){const a=Fm(A),a2=mmul(a,a);
 return T('bes','Ist A idempotent?',`Gegeben ist A = ${M(a)}. Berechnen Sie A² und entscheiden Sie.`,[mat('A² =',a2),sc('A ist …',['idempotent','nicht idempotent'],meq(a2,a)?0:1,true)],
 `A² = ${M(a2)}. `+(meq(a2,a)?'Das ist wieder A, also ist A idempotent (AA = A).':'Das ist nicht A, also ist A nicht idempotent.'))}
/* --- Determinante --- */
function tDet(A,title){const F=Fm(A),n=A.length,d=mdet(F);let sol;
 if(n===2)sol=`|A| = a₁₁a₂₂ − a₁₂a₂₁ = ${pn(A[0][0])}·${pn(A[1][1])} − ${pn(A[0][1])}·${pn(A[1][0])} = ${fstr(d)}.`;
 else if(n===3){const g=(i,j)=>F[i][j],pr=(a,b,c)=>par(fstr(fmul(fmul(a,b),c)));
  const pos=[pr(g(0,0),g(1,1),g(2,2)),pr(g(0,1),g(1,2),g(2,0)),pr(g(0,2),g(1,0),g(2,1))],neg=[pr(g(0,2),g(1,1),g(2,0)),pr(g(0,0),g(1,2),g(2,1)),pr(g(0,1),g(1,0),g(2,2))];
  sol=`Regel von Sarrus: |A| = (a₁₁a₂₂a₃₃ + a₁₂a₂₃a₃₁ + a₁₃a₂₁a₃₂) − (a₁₃a₂₂a₃₁ + a₁₁a₂₃a₃₂ + a₁₂a₂₁a₃₃) = (${pos.join(' + ')}) − (${neg.join(' + ')}) = ${fstr(d)}.`}
 else{let b={z:-1};for(let i=0;i<n;i++){const zr=F[i].filter(fz).length,zc=F.filter(r=>fz(r[i])).length;if(zr>b.z)b={z:zr,w:'Zeile',i};if(zc>b.z)b={z:zc,w:'Spalte',i}}
  sol=`Die Regel von Sarrus gilt nur für 3×3-Matrizen. Hier hilft die Laplace-Entwicklung, am besten nach der ${b.i+1}. ${b.w} (${b.z} Nullen): |A| = Σ a<sub>ij</sub>·(−1)<sup>i+j</sup>·|A<sub>ij</sub>|. Nur die Elemente ungleich null liefern einen Beitrag; die Unterdeterminanten weiter entwickeln oder mit Sarrus berechnen. Ergebnis: |A| = ${fstr(d)}.`}
 return T('det',title||`Determinante (${n}×${n})`,`Berechnen Sie die Determinante von A = ${M(A)}.`,[num('det(A) =',d)],sol)}
function tDetProps(A,B){const a=Fm(A),b=Fm(B),n=A.length,dA=mdet(a),dB=mdet(b),sw=a.slice();sw[0]=a[n-1];sw[n-1]=a[0];
 return T('det','Determinante – Rechenregeln',`Gegeben sind A = ${M(A)} und B = ${M(B)}. Berechnen Sie:`,
 [num('det(A) =',dA),num(`Determinante der Matrix, die aus A durch Vertauschen der 1. und ${n}. Zeile entsteht:`,mdet(sw)),num('det(A′) =',mdet(mT(a))),num('det(2A) =',mdet(mscal(2,a))),num('det(B) =',dB),num('det(AB) =',mdet(mmul(a,b))),num('det(A + B) =',mdet(madd(a,b)))],

function tInv(A,title){const F=Fm(A),n=A.length,d=mdet(F),I=minv(F);

function tLGS(A,b,o){o=o||{};const v=o.vars||VARS,a=Fm(A),bb=Fm(col(b)),d=mdet(a),n=A.length;need(!fz(d),'tLGS');
 const X=mmul(minv(a),bb),dj=A.map((_,j)=>mdet(a.map((r,i)=>r.map((c,k)=>k===j?bb[i][0]:c))));

 if(o.cramer)dj.forEach((x,j)=>parts.push(num(`|A(${j+1})| = (Spalte ${j+1} durch b ersetzt)`,x)));

 [mat('Symmetrische Koeffizientenmatrix A =',[[a,b],[b,c]]),sc('Q ist …',DEF,k,true)],

function parseNum(s){s=String(s).replace(/\s/g,'').replace(/−/g,'-').replace(/,/g,'.');const re=/^[+-]?(\d+\.?\d*|\.\d+)$/;
 if(s.indexOf('/')>=0){const p=s.split('/');if(p.length!==2||!re.test(p[0])||!re.test(p[1])||parseFloat(p[1])===0)return NaN;return parseFloat(p[0])/parseFloat(p[1])}

function renderTask(task,mode,idx){

 box.appendChild(el('div','prompt',task.prompt));

 const ctrls=task.parts.map(p=>{const d=el('div','part'),c={ins:[]};if(p.label)d.appendChild(el('div','plabel',p.label));
  if(p.t==='num'){const i=el('input','in num');i.type='text';i.autocomplete='off';i.placeholder='z. B. 3/7 oder 0,25';d.appendChild(i);c.ins.push(i)}

  else{c.order=p.opts.map((_,k)=>k);if(!p.fix)shuffle(c.order);c.labs=[];const name='o'+(++UID);

   c.order.forEach(k=>{const l=el('label','opt'),i=el('input');i.type=p.t==='sc'?'radio':'checkbox';i.name=name;l.appendChild(i);l.appendChild(el('span','',p.opts[k]));d.appendChild(l);c.ins.push(i);c.labs.push(l)})}
  c.fb=el('div','fb');d.appendChild(c.fb);box.appendChild(d);return c});
 function grade(reveal){let sum=0;
  task.parts.forEach((p,k)=>{const c=ctrls[k];let s=0;
   if(p.t==='num'){const v=parseNum(c.ins[0].value),ok=!isNaN(v)&&Math.abs(v-fval(p.ans))<=(p.tol||0.006);s=ok?1:0;mark(c.ins[0],ok)}
   else if(p.t==='mat'){const flat=[].concat.apply([],p.ans);let n=0;flat.forEach((a,j)=>{const v=parseNum(c.ins[j].value),ok=!isNaN(v)&&Math.abs(v-fval(a))<=0.006;if(ok)n++;mark(c.ins[j],ok)});s=n/flat.length}
   else{let ok=true,any=false;c.labs.forEach((l,j)=>{const should=p.t==='sc'?c.order[j]===p.ans:p.ans.indexOf(c.order[j])>=0,is=c.ins[j].checked;if(is)any=true;if(should!==is)ok=false;
     l.classList.remove('optok','optbad');if(is)l.classList.add(should?'optok':'optbad');else if(reveal&&should)l.classList.add('optok')});s=ok&&any?1:0}
   c.fb.className='fb '+(s===1?'ok':'bad');c.fb.textContent=s===1?'✓ richtig':(s>0?'teilweise richtig ('+Math.round(s*100)+' %)':'✗ nicht richtig');sum+=s});

 main.appendChild(el('div','card',`<h2>${title}</h2><div class="mut">${intro}</div>`));

function runTest(main,k){const test=TESTS[k],total=test.tasks.reduce((s,t)=>s+t.pts,0);main.innerHTML='';
 const tb=el('div','timer',`<strong>${test.name}</strong><span class="mut">${test.tasks.length} Aufgaben · ${total} Punkte · keine Rückmeldung vor der Abgabe</span><span id="clock">30:00</span>`);
 const fin=el('button','pri','Abgeben');tb.appendChild(fin);main.appendChild(tb);
 const res=el('div');main.appendChild(res);
 const rs=test.tasks.map((t,i)=>{const r=renderTask(t,'test',i+1);main.appendChild(r.box);return r});
 const fin2=el('button','pri','Test abgeben und auswerten');main.appendChild(fin2);
 let left=30*60;const clock=$('#clock');
 function submit(timeout){clearInterval(timerId);timerId=null;let pts=0;
  const rows=rs.map((r,i)=>{const s=r.grade(true)*test.tasks[i].pts;pts+=s;r.showSol();r.lock();return`<tr><td>${i+1}. ${test.tasks[i].title}</td><td>${nstr(Math.round(s*10)/10)} / ${test.tasks[i].pts}</td></tr>`});
  const pct=Math.round(pts/total*1000)/10,b=bonus(pct),used=30*60-left;
  res.appendChild(el('div','card',`<h2>Auswertung ${test.name}</h2>${timeout?'<p class="fb bad">Die Zeit ist abgelaufen – der Test wurde automatisch abgegeben.</p>':''}<div class="big">${nstr(Math.round(pts*10)/10)} von ${total} Punkten = ${nstr(pct)} %</div><p>Das entspräche <strong>${b} Bonuspunkt${b===1?'':'en'}</strong> für die Klausur (ab 50 % → 1, ab 70 % → 2, ab 85 % → 3). Benötigte Zeit: ${Math.floor(used/60)} min ${used%60} s.</p><table class="info"><tr><th>Aufgabe</th><th>Punkte</th></tr>${rows.join('')}</table><p class="mut">Unten stehen bei jeder Aufgabe die richtigen Antworten und der Lösungsweg.</p>`));
  tb.remove();fin2.remove();const st=load();st.tests=st.tests||{};if(!(st.tests[k]>=pct))st.tests[k]=pct;save(st);window.scrollTo(0,0)}
 timerId=setInterval(()=>{left--;clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=300)clock.classList.add('warn');if(left<=0)submit(true)},1000);
 fin.onclick=fin2.onclick=()=>{if(confirm('Test wirklich abgeben? Danach sind keine Änderungen mehr möglich.'))submit(false)}}
const VIEWS={
 home(main){main.appendChild(el('div','card',`<h2>Lernapp Lineare Algebra</h2><p>Zur Vorlesung <strong>Wirtschaftsmathematik, Kapitel 1 „Lineare Algebra“</strong> (Prof. Dimpfl, Universität Hohenheim). Alle Aufgaben verwenden die Schreibweise der Vorlesung (A′ für die Transponierte, rg(A) für den Rang).</p>`));
  const g=el('div','grid');[['mc','Multiple Choice',MCQ.length+' Verständnisfragen mit Erklärung'],['calc','Rechenaufgaben',CALC.length+' Aufgaben mit Zahlen- und Matrixeingabe'],['tests','Probetests','3 Tests · je 30 Minuten · wie der Zwischentest'],['formeln','Formeln','Das Wichtigste aus Kapitel 1 auf einen Blick']].forEach(([v,t,d])=>{const b=el('button','tile',`<small>${t}</small><span>${d}</span>`);b.onclick=()=>show(v);g.appendChild(b)});main.appendChild(g);
  main.appendChild(el('div','card',`<h2>So sieht der echte Test aus</h2><ul><li><strong>Erster Zwischentest am 20. November 2026</strong>, 30 Minuten, digital auf ILIAS-ok in Präsenz (eigener Laptop mit Safe Exam Browser – vorher installieren und testen!).</li><li>Freiwillig und unbenotet, bringt aber bis zu 3 Bonuspunkte für die Klausur: unter 50 % → 0, ab 50 % → 1, ab 70 % → 2, ab 85 % → 3 Punkte.</li><li>In den Vorjahren rund 9–10 Aufgaben, fast alle mit <strong>Zahlen- oder Matrixeingabe</strong>, nur wenige Single/Multiple Choice. Die Aufgaben stammen aus den wöchentlichen Online-Aufgaben, nur mit anderen Zahlen.</li><li>Typische Themen im 1. Test: Matrixmultiplikation, Vektorprodukt und Länge, Winkel zwischen Vektoren, Orthogonalität, Determinante (inkl. Rechenregeln), Inverse, Rang, Idempotenz, Matrixgleichung nach X auflösen, quadratische Formen.</li><li>Brüche werden als z. B. <code>3/7</code> eingegeben, Winkel auf ganze Grad gerundet.</li><li>Erlaubt sind nur die zugelassenen wissenschaftlichen Taschenrechner (z. B. Casio fx-810DE CW, TI-30X Prio MathPrint, Sharp EL-W550TG).</li></ul><p class="mut">Die beste Vorbereitung bleiben die Online-Aufgaben (Format A und B) auf ILIAS-ok – diese App ergänzt sie, ersetzt sie aber nicht.</p>`));
  main.appendChild(el('div','card',`<h2>Eingabe-Hinweise</h2><ul><li>Ganze Zahlen, Dezimalzahlen (Punkt oder Komma) und Brüche wie <code>-3/2</code> werden akzeptiert.</li><li>Gerundete Ergebnisse auf 2 Dezimalstellen angeben.</li><li>„Prüfen“ zeigt, was stimmt; „Lösung zeigen“ blendet Ergebnis und Lösungsweg ein.</li></ul>`))},
 mc(main){listView(main,MCQ,'Multiple Choice','Verständnisfragen zu allen Abschnitten von Kapitel 1. Bei „Multiple Choice“ können mehrere Antworten richtig sein, bei „Single Choice“ genau eine. Die Reihenfolge der Antworten wird jedes Mal gemischt.')},
 calc(main){listView(main,CALC,'Rechenaufgaben','Aufgaben im Stil der ILIAS-Online-Aufgaben: Ergebnis eintippen, prüfen, bei Bedarf Lösungsweg ansehen. Erst selbst auf Papier rechnen!')},
 tests(main){const st=load().tests||{};main.appendChild(el('div','card',`<h2>Probetests</h2><p>Jeder Probetest dauert <strong>30 Minuten</strong> und ist wie der Zwischentest aufgebaut. Während des Tests gibt es keine Rückmeldung; ausgewertet wird erst nach der Abgabe (oder automatisch, wenn die Zeit abgelaufen ist). Taschenrechner, Stift und Papier bereitlegen.</p>`));
  const g=el('div','grid');TESTS.forEach((t,k)=>{const b=el('button','tile',`<small>${t.name}</small><span>${t.tasks.length} Aufgaben · ${t.tasks.reduce((s,x)=>s+x.pts,0)} Punkte</span><span class="mut">${st[k]!==undefined?'Bestes Ergebnis: '+nstr(st[k])+' %':'noch nicht bearbeitet'}</span>`);b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='tests'));runTest(main,k);window.scrollTo(0,0)};g.appendChild(b)});main.appendChild(g)},
 formeln(main){main.appendChild(el('div','card fs',FORMELN))}

function show(v){if(timerId){clearInterval(timerId);timerId=null}
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 const main=$('#view');main.innerHTML='';VIEWS[v](main);window.scrollTo(0,0)}
const FORMELN=`<h2>Formeln zu Kapitel 1</h2>
<h3>Vektoren</h3><ul><li>Inneres Produkt: v′w = Σvᵢwᵢ (Skalar); äußeres Produkt: vw′ (Matrix)</li><li>Länge: ‖v‖ = √(v′v); normierter Vektor: ṽ = v/‖v‖</li><li>Winkel: cos γ = v′w / (‖v‖·‖w‖); orthogonal ⇔ v′w = 0; orthonormal = orthogonal und Länge 1</li><li>Konvexkombination: Gewichte ≥ 0 mit Summe 1</li><li>Linear unabhängig: Σλᵢvᵢ = 0 nur für alle λᵢ = 0; Basis des ℝⁿ: n linear unabhängige Vektoren</li><li>Summen: ι′x = Σxᵢ, x′x = Σxᵢ², x′y = Σxᵢyᵢ</li></ul>
<h3>Matrizenrechnung</h3><ul><li>Konformität: (n×m)(m×p) → (n×p); Element (i, j) = Zeile i mal Spalte j</li><li>(AB)C = A(BC), A(B + C) = AB + AC, aber im Allgemeinen AB ≠ BA</li><li>(A′)′ = A, (A + B)′ = A′ + B′, (AB)′ = B′A′</li><li>(A + B)² = A² + AB + BA + B²; A⁰ = I; keine Division durch Matrizen</li></ul>
<h3>Besondere Matrizen</h3><ul><li>Symmetrisch: A′ = A; B′B und BB′ sind immer symmetrisch</li><li>Idempotent: AA = A (z. B. I, P = X(X′X)⁻¹X′)</li><li>Diagonal-, Dreiecks-, Einheits- und Nullmatrix</li></ul>
<h3>Determinante</h3><ul><li>2×2: |A| = a₁₁a₂₂ − a₁₂a₂₁; 3×3: Sarrus (nur 3×3!); sonst Laplace: |A| = Σⱼ aᵢⱼ(−1)<sup>i+j</sup>|Aᵢⱼ|</li><li>Zeilentausch → Vorzeichenwechsel; Vielfaches einer Zeile addieren → keine Änderung</li><li>det(A′) = det(A), det(kA) = kⁿdet(A), det(AB) = det(A)·det(B), det(A⁻¹) = 1/det(A), det(I) = 1</li><li>det(A + B) ≠ det(A) + det(B) im Allgemeinen</li><li>det(A) = 0 ⇔ Spalten linear abhängig ⇔ A singulär ⇔ rg(A) &lt; n</li></ul>
<h3>Inverse</h3><ul><li>AA⁻¹ = A⁻¹A = I; nur für quadratische, reguläre Matrizen; eindeutig</li><li>2×2: A⁻¹ = 1/|A| · ${M([['a₂₂','−a₁₂'],['−a₂₁','a₁₁']])}</li><li>Allgemein: bᵢⱼ = (1/|A|)(−1)<sup>i+j</sup>|Aⱼᵢ| oder Gauß: (A | I) → (I | A⁻¹)</li><li>(A⁻¹)⁻¹ = A, (AB)⁻¹ = B⁻¹A⁻¹, (A′)⁻¹ = (A⁻¹)′</li><li>AX = B → X = A⁻¹B; XA = B → X = BA⁻¹</li></ul>
<h3>Rang</h3><ul><li>Maximale Anzahl linear unabhängiger Spalten = Zeilen; rg(A) ≤ min(m, n)</li><li>rg(A) = rg(A′) = rg(A′A); n×n-Matrix regulär ⇔ rg(A) = n</li><li>Bestimmung: Gauß → Anzahl der Zeilen ungleich null in der Stufenform</li></ul>
<h3>Lineare Gleichungssysteme Ax = b (m Unbekannte)</h3><ul><li>rg(A) &lt; rg(A | b): keine Lösung</li><li>rg(A) = rg(A | b) = m: genau eine Lösung</li><li>rg(A) = rg(A | b) = r &lt; m: unendlich viele Lösungen, m − r freie Variablen</li><li>Lösung: x = A⁻¹b, Cramer xⱼ = |A(j)|/|A|, oder Gauß-Elimination</li><li>Homogen (b = 0): immer triviale Lösung; nichttriviale nur bei rg(A) &lt; m</li></ul>
<h3>Quadratische Formen</h3><ul><li>Q = ax² + 2bxy + cy² = x′Ax mit A = ${M([['a','b'],['b','c']])}</li><li>a &gt; 0 und ac − b² &gt; 0: positiv definit; a &lt; 0 und ac − b² &gt; 0: negativ definit; ac − b² &lt; 0: indefinit</li><li>Allgemein über führende Hauptminoren: alle &gt; 0 → positiv definit; −, +, −, … → negativ definit</li><li>Unter Nebenbedingung αx + βy = 0: geränderte Matrix ${M([[0,'α','β'],['α','a','b'],['β','b','c']])}; Determinante &lt; 0 → positiv definit, &gt; 0 → negativ definit (unter der NB)</li></ul>`;
